<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Construcción</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            border: 1px solid #334155;
        }

        .icon {
            font-size: 54px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .badge {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .time-info {
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🚧</div>
        <h1 id="saludo">Sitio en Construcción</h1>
        <p>Estamos trabajando duro para ofrecerte una gran experiencia. ¡Regresa pronto para ver todas las novedades!</p>
        
        <div class="status-container">
            <span class="badge">Próximamente</span>
            <div class="time-info" id="reloj">Cargando la hora...</div>
        </div>
    </div>

    <script>
        // JavaScript ejecutado en el navegador del usuario para dinamismo sin PHP
        function actualizarPagina() {
            const fecha = new Date();
            const hora = fecha.getHours();
            const saludoElemento = document.getElementById('saludo');
            const relojElemento = document.getElementById('reloj');

            let saludoTexto = "¡Hola! Sitio en Construcción";
            if (hora >= 6 && hora < 12) {
                saludoTexto = "¡Buenos días! Sitio en Construcción";
            } else if (hora >= 12 && hora < 20) {
                saludoTexto = "¡Buenas tardes! Sitio en Construcción";
            } else {
                saludoTexto = "¡Buenas noches! Sitio en Construcción";
            }

            saludoElemento.textContent = saludoTexto;
            relojElemento.textContent = "Hora local del visitante: " + fecha.toLocaleTimeString('es-ES');
        }

        actualizarPagina();
        setInterval(actualizarPagina, 1000);
    </script>

</body>
</html>
